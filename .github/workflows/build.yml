name: Build WineCX

on:
  workflow_dispatch:
    inputs:
      winecx_version:
        description: "WineCX source version"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build WineCX (${{ matrix.build_type }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: wow64
            configure_flags: "--enable-archs=i386,x86_64"
          - build_type: 64bitonly
            configure_flags: "--enable-win64"
          - build_type: 32bitonly
            configure_flags: ""

    env:
      WINECX_VERSION: ${{ inputs.winecx_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Ubuntu release
        id: platform
        run: |
          UBUNTU_CODENAME=$(grep '^UBUNTU_CODENAME=' /etc/os-release | cut -d'=' -f2 | tr -d '"')
          if [ -z "$UBUNTU_CODENAME" ]; then
            UBUNTU_CODENAME=$(grep '^VERSION_CODENAME=' /etc/os-release | cut -d'=' -f2 | tr -d '"')
          fi
          echo "codename=$UBUNTU_CODENAME" >> "$GITHUB_OUTPUT"
          echo "Ubuntu codename: $UBUNTU_CODENAME"

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y \
            gcc-multilib \
            libc6-dev-i386 \
            gcc-mingw-w64 \
            mingw-w64 \
            libasound2-dev \
            bluez \
            libdbus-1-dev \
            libpulse-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libgnutls28-dev \
            libgl-dev \
            libunwind-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxext-dev \
            libwayland-bin \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbregistry-dev \
            libegl-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsdl2-dev \
            libudev-dev \
            libvulkan-dev \
            libcups2-dev \
            libgphoto2-dev \
            libsane-dev \
            libkrb5-dev \
            samba-dev \
            smbclient \
            ocl-icd-opencl-dev \
            libpcap-dev \
            libusb-1.0-0-dev \
            libv4l-dev \
            flex \
            bison \
            libx11-dev:i386

      - name: Download WineCX source
        run: |
          wget -O crossover-sources-${WINECX_VERSION}.tar.gz https://media.codeweavers.com/pub/crossover/source/crossover-sources-${WINECX_VERSION}.tar.gz
          tar -xzf crossover-sources-${WINECX_VERSION}.tar.gz

      - name: Configure WineCX
        run: |
          cp "${GITHUB_WORKSPACE}"/distversion.h "${GITHUB_WORKSPACE}"/sources/wine/programs/winedbg/distversion.h
          cd sources/wine
          ./configure ${{ matrix.configure_flags }} --prefix=/

      - name: Compile WineCX
        run: |
          cd sources/wine
          make -j"$(nproc)"

      - name: Install WineCX
        run: |
          cd sources/wine
          make install DESTDIR="$GITHUB_WORKSPACE/winecx"

      - name: Create tar.xz archive
        id: archive
        run: |
          ARCHIVE="winecx-crossover-${WINECX_VERSION}-${{ steps.platform.outputs.codename }}-${{ matrix.build_type }}.tar.xz"
          mkdir -p $GITHUB_WORKSPACE/dist
          tar -cJf "$GITHUB_WORKSPACE/dist/$ARCHIVE" -C "$GITHUB_WORKSPACE/winecx" .
          cd $GITHUB_WORKSPACE/dist
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256sum"
          echo "codename=${{ steps.platform.outputs.codename }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winecx-builds-${{ matrix.build_type }}
          path: dist/*
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Get Platform Codename
        id: platform
        run: |
          UBUNTU_CODENAME=$(grep '^UBUNTU_CODENAME=' /etc/os-release | cut -d'=' -f2 | tr -d '"')
          echo "codename=$UBUNTU_CODENAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winecx-${{ inputs.winecx_version }}-${{ steps.platform.outputs.codename }}
          name: ${{ inputs.winecx_version }}
          body: |
            WineCX Crossover ${{ inputs.winecx_version }}
            - Build Environment: Ubuntu ${{ steps.platform.outputs.codename }}
            - Source: https://media.codeweavers.com/pub/crossover/source/crossover-sources-${{ inputs.winecx_version }}.tar.gz
          overwrite_files: true
          files: |
            dist/*.tar.xz
            dist/*.sha256sum
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}